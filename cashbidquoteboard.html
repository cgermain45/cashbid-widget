<body>

<!--
  Panels can be cash bids, futures quotes, weather, announcements or video/web embeds. Optional attributes:
    data-json            — cash bid feed URL to use without asking (otherwise
                           Cash Bids panels ask for it once and remember it)
    data-futures-apikey  — built-in Barchart OnDemand key for futures panels
                           (visible in page source; otherwise each viewer
                           enters their own key in the panel)
    data-futures-feed    — alternate getQuote URL (e.g. a proxy)
    data-news-sources    — news source codes for the News Ticker (default BRUG)
    data-news-feed       — alternate getNews URL (e.g. a proxy)
  The News Ticker uses the same Barchart OnDemand key as the futures panels.
-->
<div id="sg-quoteboard"></div>

<script src="sg-cashbid-widget-dev.js"></script>
<script src="sg-ticker.js"></script>
<script src="sg-weather.js"></script>
<script src="sg-futures.js"></script>
<script src="sg-news.js"></script>
<script src="sg-announce.js"></script>
<script src="sg-embed.js"></script>
<script src="sg-quoteboard.js"></script>
</body>
</html>
